name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check sources and tests
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run compile

      - name: Test
        run: npx vitest run

      - name: Package extension
        run: npm run vsix

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: elyapi-client-vsix
          path: '*.vsix'
          if-no-files-found: error
